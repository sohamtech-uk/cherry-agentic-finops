[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cherry-agentic-finops"
version = "0.1.0"
description = "Cherry Agent: autonomous, human-governed finance operations built with Gemini and Google ADK."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Soham London CIC"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "google-adk>=2.1,<3",
  "google-auth>=2.40,<3",
  "google-genai>=2.6,<3",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-storage>=3.1,<4",
  "google-cloud-pubsub>=2.30,<3",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
  "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
cherry-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "agents*", "evals*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/private_markets.py" = ["E501", "SIM114"]
"app/private_markets_router.py" = ["E501"]
"app/private_markets_strict.py" = ["E501", "SIM103"]
"app/nav_quality.py" = ["E501"]
"app/ylookup_datasets.py" = ["E501"]
"app/ylookup_router.py" = ["E501"]
"app/fund_reconciliation.py" = ["E501"]
"tests/test_fund_reconciliation.py" = ["E501"]
"app/exception_investigation.py" = ["E501"]
"tests/test_exception_investigation.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["app.private_markets", "app.document_ai"]
disable_error_code = ["arg-type"]
