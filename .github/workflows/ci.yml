name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app agents
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q app agents
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check browser JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/fund_manager.js
          node --check app/static/fund_manager_completion.js
          node --check app/static/nav_manager.js
          node --check app/static/nav_quality_controller.js
      - name: Build container
        run: docker build --tag cherry-agent:test .
