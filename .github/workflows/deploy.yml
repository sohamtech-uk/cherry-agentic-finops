name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  SERVICE: cherry-finops
  REPOSITORY: cherry-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          env_vars: |-
            CHERRY_ENVIRONMENT=production
            CHERRY_PUBLIC_BASE_URL=https://finops.cherrymoney.co.uk
            CHERRY_PERSISTENCE_BACKEND=firestore
            CHERRY_GEMINI_MODEL=gemini-3.7-flash
            CHERRY_PRIVATE_MARKETS_UPLOAD_TOKEN=${{ secrets.CHERRY_PRIVATE_MARKETS_UPLOAD_TOKEN }}
            CHERRY_MONEY_API_URL=https://cherrymoney.co.uk
            CHERRY_MONEY_API_TOKEN=${{ secrets.CHERRY_MONEY_API_TOKEN }}
            FUNDOPS_STUDIO_API_URL=${{ vars.FUNDOPS_STUDIO_API_URL }}
            FUNDOPS_STUDIO_AUDIENCE=${{ vars.FUNDOPS_STUDIO_AUDIENCE }}
            FUNDOPS_STUDIO_API_TOKEN=${{ secrets.FUNDOPS_STUDIO_API_TOKEN }}
            FUNDOPS_STUDIO_TIMEOUT_SECONDS=25
            GOOGLE_GENAI_USE_VERTEXAI=true
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            CHERRY_EVIDENCE_BUCKET=${{ vars.GCP_PROJECT_ID }}-cherry-finops-evidence
            CHERRY_PUBSUB_TOPIC=finance-workflow-events
          flags: >-
            --allow-unauthenticated
            --ingress=all
            --default-url
            --service-account=cherry-agent-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=5

      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/"
          curl --fail --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/config"
          curl --fail --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/private-markets/health"
          curl --fail --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/private-markets/integration/health"
          curl --fail --retry 8 --retry-delay 5 \
            -X POST "${{ steps.deploy.outputs.url }}/api/private-markets/demo/clean"
