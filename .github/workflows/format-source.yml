name: Format and validate Cherry Agent source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  format:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == '[format-source]' &&
       github.event.issue.user.login == 'sohamtechuk')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          pytest -q
          python -m compileall -q app agents main.py

      - name: Commit formatting changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'commit='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Format and validate Cherry Agent source'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'commit='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v7
        env:
          RESULT_COMMIT: ${{ steps.commit.outputs.commit }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Source formatting completed. Changed: **${process.env.CHANGED}**. Validated commit: \`${process.env.RESULT_COMMIT}\`.`
            });
