name: Format Ylookup hardening branch

on:
  push:
    branches:
      - harden/ylookup-ready-2026-09-05

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: harden/ylookup-ready-2026-09-05
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.6"

      - name: Format source
        run: ruff format app/private_markets_strict.py app/private_markets_router.py tests/test_private_markets_strict.py

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/private_markets_strict.py app/private_markets_router.py tests/test_private_markets_strict.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format Ylookup hardening source'
          git push origin HEAD:harden/ylookup-ready-2026-09-05
