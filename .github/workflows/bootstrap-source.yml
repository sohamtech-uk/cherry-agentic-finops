name: Bootstrap project source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/project.tar.gz.b64"
      - ".github/workflows/bootstrap-source.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == '[bootstrap-source]' &&
       github.event.issue.user.login == 'sohamtechuk')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract project
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          root = pathlib.Path.cwd().resolve()
          payload = pathlib.Path('.bootstrap/project.tar.gz.b64').read_text().strip()
          archive = base64.b64decode(payload, validate=True)
          expected = '1259ba0c4955d0d10cd47a9c8a81966f65147e1ec6084f0edebc0981d5414a5f'
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'Archive checksum mismatch: {actual}')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(root, members=members, filter='data')

          pathlib.Path('.bootstrap/project.tar.gz.b64').unlink()
          pathlib.Path('.github/workflows/bootstrap-source.yml').unlink()

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Cherry Agent implementation"
          git push origin HEAD:main
